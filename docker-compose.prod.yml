services:
  nginx:
    image: nginx:1.27-alpine
    container_name: mtt-nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  backend:
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  postgres:
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "synchronous_commit=on"
